plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev' version '2.0.148'
	id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
sourceSets.main.resources { srcDir 'src/generated/resources' }

neoForge {
	version = project.neo_version
	runs {
		client { client() }
		server {
			server()
			programArgument '--nogui'
		}
		data {
			clientData()
			programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
		}
	}
	mods {
		"${mod_id}" { sourceSet sourceSets.main }
	}
}

repositories { maven { url 'https://maven.blamejared.com' } }

// Ship the integration without making JEI a required mod or bundling it in this jar.
dependencies {
	compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
	if (providers.gradleProperty('jei_runtime').getOrElse('true').toBoolean()) {
		runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
	}
}

tasks.withType(ProcessResources).configureEach {
	var replaceProperties = [
		minecraft_version: minecraft_version,
		minecraft_version_range: minecraft_version_range,
		neo_version: neo_version,
		neo_version_range: neo_version_range,
		loader_version_range: loader_version_range,
		mod_id: mod_id,
		mod_name: mod_name,
		mod_license: mod_license,
		mod_version: mod_version,
		mod_authors: mod_authors,
		mod_description: mod_description
	]
	inputs.properties replaceProperties
	filesMatching('META-INF/neoforge.mods.toml') { expand replaceProperties }
}

publishing {
	publications {
		register('mavenJava', MavenPublication) { from components.java }
	}
	repositories { maven { url "file://${project.projectDir}/repo" } }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
