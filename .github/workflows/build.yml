name: Manual Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft 26.2 Mod
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Build mod
        run: bash ./gradlew build --no-daemon --stacktrace -Pjei_runtime=false

      - name: Upload mod JAR
        uses: actions/upload-artifact@v6
        with:
          name: everythingcopper-${{ github.run_number }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 1
